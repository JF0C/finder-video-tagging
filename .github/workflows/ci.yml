name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check Swift file lengths
        run: Scripts/check-file-lengths.sh

      - name: Lint Swift formatting
        run: swift format lint --recursive --strict Sources Tests Scripts/CoverageGuard.swift Package.swift

      - name: Build
        run: swift build

      - name: Test coverage guard
        run: Scripts/test-coverage-guard.sh

      - name: Test and enforce coverage
        env:
          COVERAGE_BASE_REF: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: Scripts/check-coverage.sh